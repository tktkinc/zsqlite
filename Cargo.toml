[package]
name = "zsqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
autobenches = false
license = "MIT"
description = "A transparent Zstandard-compressed page VFS for SQLite"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zsqlite"
path = "src/bin/zsqlite.rs"

[[bench]]
name = "vfs_performance"
harness = false
required-features = ["static"]

[[bench]]
name = "frame_layout"
harness = false
required-features = ["static"]

[[bench]]
name = "transcript_queries"
harness = false
required-features = ["static"]

[[bench]]
name = "transcript_replay"
harness = false
required-features = ["static"]

[[bench]]
name = "gc_object_storage"
harness = false
required-features = ["static"]

[dependencies]
blake3 = "1.8.2"
crc32fast = "1.5.0"
getrandom = "0.4.2"
libsqlite3-sys = "0.38.2"
thiserror = "2.0.16"
tempfile = "3.21.0"
zstd = { version = "0.13.3", default-features = false, features = ["zdict_builder"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos"))'.dependencies]
libc = "0.2.189"

[features]
default = ["loadable"]
loadable = ["libsqlite3-sys/loadable_extension"]
static = ["libsqlite3-sys/bundled"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
