name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy
          targets: wasm32-unknown-emscripten
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23
      - run: npm ci
        working-directory: web
      - name: Build and check WASM
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cargo clippy --target wasm32-unknown-emscripten --no-default-features --features browser --bin zsqlite-browser -- -D warnings
          bash web/build.sh
      - run: npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: zsqlite-browser
          path: web/dist/
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features static -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features --features static
      - name: Repeat high-contention schedules
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            cargo test --no-default-features --features static parallel -- --test-threads=1
            cargo test --no-default-features --features static concurrent_open_write_close_churn -- --test-threads=1
            cargo test --no-default-features --features static concurrent_wal_readers_and_writers -- --test-threads=1
            cargo test --no-default-features --features static independent_processes_serialize -- --test-threads=1
            cargo test --no-default-features --features static simultaneous_process_creation -- --test-threads=1
          done
      - run: cargo build --release
      - name: Smoke-test host SQLite loading
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            extension=target/release/libzsqlite.dylib
          else
            extension=target/release/libzsqlite.so
          fi
          python3 tests/loadable_smoke.py "$extension" --cli target/release/zsqlite
