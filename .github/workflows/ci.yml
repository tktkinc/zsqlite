name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features static -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features --features static
      - name: Repeat high-contention schedules
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            cargo test --no-default-features --features static parallel -- --test-threads=1
            cargo test --no-default-features --features static concurrent_open_write_close_churn -- --test-threads=1
            cargo test --no-default-features --features static concurrent_wal_readers_and_writers -- --test-threads=1
            cargo test --no-default-features --features static independent_processes_serialize -- --test-threads=1
            cargo test --no-default-features --features static simultaneous_process_creation -- --test-threads=1
          done
      - run: cargo build --release
      - name: Smoke-test host SQLite loading
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            extension=target/release/libzsqlite.dylib
          else
            extension=target/release/libzsqlite.so
          fi
          python3 tests/loadable_smoke.py "$extension" --cli target/release/zsqlite
